<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>MY META VEVERS</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <style>
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
        background: #0b0e14;
        touch-action: none; overscroll-behavior: none;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      }
      #unity-container.unity-mobile { position: fixed; inset: 0; width: 100vw; height: 100dvh; }
      #unity-canvas.unity-mobile { width: 100% !important; height: 100% !important; touch-action: none; }
      #mobile-fullscreen-btn {
        display: none; position: fixed; top: 12px; right: 12px; z-index: 9000;
        background: rgba(15, 20, 30, 0.72); color: #fff; border: 1px solid rgba(255,255,255,0.28);
        border-radius: 8px; padding: 8px 12px; font: 600 13px/1 system-ui, sans-serif;
        backdrop-filter: blur(6px); cursor: pointer;
      }
      #mobile-portrait-overlay {
        display: none; position: fixed; inset: 0; z-index: 9999;
        background: rgba(10, 14, 22, 0.95); color: #fff;
        flex-direction: column; align-items: center; justify-content: center;
        text-align: center; padding: 24px; font-family: system-ui, -apple-system, sans-serif;
      }
      #mobile-portrait-overlay .rotate-icon { font-size: 54px; margin-bottom: 16px; }
      #mobile-portrait-overlay h2 { margin: 0 0 8px; font-size: 20px; font-weight: 700; }
      #mobile-portrait-overlay p { margin: 0 0 20px; font-size: 14px; opacity: 0.8; }
      #mobile-portrait-overlay button {
        background: #29b6f6; color: #081018; border: none; border-radius: 10px;
        padding: 12px 20px; font-size: 15px; font-weight: 700; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">My proje test</div>
      </div>
    </div>
    <button id="mobile-fullscreen-btn" type="button">⛶ เต็มจอ</button>
    <div id="mobile-portrait-overlay">
      <div class="rotate-icon">📱 ↻</div>
      <h2>กรุณาตะแคงจอมือถือเป็นแนวนอน</h2>
      <p>เกมนี้ออกแบบสำหรับมุมมองแนวนอน (Landscape) เพื่อการบังคับที่ถนัดที่สุด</p>
      <button id="portrait-fullscreen-btn" type="button">ขยายเต็มจอแนวนอน</button>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGL.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.data.unityweb",
        frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
        codeUrl: buildUrl + "/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "My proje test",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      var isMobileDevice = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) ||
        (window.matchMedia && window.matchMedia('(pointer: coarse)').matches && navigator.maxTouchPoints > 0);
      if (isMobileDevice) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 1.5);


      } else {
        // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                document.querySelector("#unity-loading-bar").style.display = "none";
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

              }).catch((message) => {
                alert(message);
              });
            };

      if (typeof isMobileDevice !== 'undefined' && isMobileDevice) {
        var fsBtn = document.getElementById('mobile-fullscreen-btn');
        var portraitOverlay = document.getElementById('mobile-portrait-overlay');
        var portraitFsBtn = document.getElementById('portrait-fullscreen-btn');
        if (fsBtn) fsBtn.style.display = 'block';

        function requestLandscapeFullscreen() {
          var el = document.documentElement;
          var req = el.requestFullscreen || el.webkitRequestFullscreen;
          if (req) {
            Promise.resolve(req.call(el)).then(function() {
              if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(function(){});
              }
            }).catch(function(){});
          }
        }
        if (fsBtn) fsBtn.addEventListener('click', requestLandscapeFullscreen);
        if (portraitFsBtn) portraitFsBtn.addEventListener('click', requestLandscapeFullscreen);

        function checkOrientation() {
          if (!portraitOverlay) return;
          var isPortrait = window.innerHeight > window.innerWidth;
          portraitOverlay.style.display = isPortrait ? 'flex' : 'none';
        }
        window.addEventListener('resize', checkOrientation);
        window.addEventListener('orientationchange', checkOrientation);
        checkOrientation();
      }
      document.body.appendChild(script);

    </script>
  </body>
</html>
